name: Build Wine unix libs for iOS

on:
  workflow_dispatch:
  push:
    branches: [fix/ci-ios-build, main]
    paths:
      - ".github/workflows/uncrashed-wine.yml"
      - "scripts/prepare-wine-ios.sh"
      - "build/wineserver/**"
      - "build/ntdll-unix/**"
      - "build/win32u-unix/**"
      - "build/freetype-ios/**"
      - "build/gnutls-ios/**"
      - "build/crypto-unix/**"
      - "tools/validate-ios-bundle.py"
      - "wine/**"
      - ".gitmodules"

permissions:
  contents: read

concurrency:
  group: uncrashed-wine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wine-script-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: false
      - name: Validate build scripts and archive validator
        run: |
          for script in scripts/prepare-wine-ios.sh build/{wineserver,ntdll-unix,win32u-unix,freetype-ios}/build.sh build/ntdll-unix/compile_patched.sh; do
            bash -n "$script"
          done
          python3 tools/test_validate_ios_bundle.py

  wine-unix-build:
    if: github.event_name == 'workflow_dispatch'
    needs: wine-script-check
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Select Xcode and install build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install llvm cmake bison flex
          for package in llvm bison flex; do
            echo "$(brew --prefix "$package")/bin" >> "$GITHUB_PATH"
          done
      - name: Fetch pinned Wine sources
        run: git submodule update --init --depth 1 wine
      - name: Restore dependency cache
        uses: actions/cache@v4
        with:
          path: |
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
            toolchains/gnutls-ios
            build/gnutls-ios/obj
          key: wine-ios-deps-${{ runner.arch }}-xcode26.3-${{ hashFiles('build/gnutls-ios/build.sh', 'build/gnutls-ios/src/SHA256SUMS', 'scripts/prepare-wine-ios.sh', 'wine/configure.ac') }}-v1
      - name: Build and validate GnuTLS stack
        run: |
          valid=true
          for lib in gmp nettle hogweed gnutls; do
            python3 tools/validate-ios-bundle.py --archive "toolchains/gnutls-ios/lib/lib$lib.a" || valid=false
          done
          [[ -s toolchains/gnutls-ios/include/gnutls/gnutls.h ]] || valid=false
          if [[ "$valid" != true ]]; then
            rm -f build/gnutls-ios/obj/{gmp,nettle,gnutls}.done
            bash build/gnutls-ios/build.sh 2>&1 | tee gnutls-build.log
          fi
          for lib in gmp nettle hogweed gnutls; do
            python3 tools/validate-ios-bundle.py --archive "toolchains/gnutls-ios/lib/lib$lib.a"
          done
      - name: Prepare Wine headers and FreeType
        run: bash scripts/prepare-wine-ios.sh
      - name: Build Wine server
        run: bash build/wineserver/build.sh 2>&1 | tee wineserver-build.log
      - name: Build Wine ntdll and crypto/network unixlibs
        run: bash build/ntdll-unix/build.sh 2>&1 | tee ntdll-build.log
      - name: Build Wine win32u
        run: bash build/win32u-unix/build.sh 2>&1 | tee win32u-build.log
      - name: Validate every output archive
        run: |
          for lib in libwineserver.a libntdll_unix.a libwin32u_unix.a; do
            python3 tools/validate-ios-bundle.py --archive "app/Madeira/$lib"
          done
      - name: Upload built libraries
        uses: actions/upload-artifact@v5
        with:
          name: wine-unix-libs
          path: |
            app/Madeira/libwineserver.a
            app/Madeira/libntdll_unix.a
            app/Madeira/libwin32u_unix.a
          if-no-files-found: error
          retention-days: 7
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: wine-unix-build-logs
          path: |
            *-build.log
            wine-configure.log
            wine/build-macos/config.log
            build/**/obj/*.err
            build/**/obj/err-*.txt
            build/gnutls-ios/obj/*.log
          if-no-files-found: warn
          retention-days: 7
