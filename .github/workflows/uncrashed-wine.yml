name: Build Wine unix libs for iOS (scaffolding)

on:
  workflow_dispatch:
  push:
    branches: [fix/ci-ios-build, main]
    paths:
      - ".github/workflows/uncrashed-wine.yml"
      - "build/wineserver/**"
      - "build/ntdll-unix/**"
      - "build/win32u-unix/**"
      - "wine/**"
      - ".gitmodules"

permissions:
  contents: read

concurrency:
  group: uncrashed-wine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  wine-unix-check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Fetch wine submodule (shallow)
        run: |
          git submodule update --init --depth 1 wine
          test -f wine/CMakeLists.txt -o -f wine/configure.ac || { echo "wine sources missing"; ls wine | head -n 20; exit 1; }
          git -C wine log --oneline -3
      - name: Validate Wine iOS build scripts without compiling
        run: |
          bash -n build/wineserver/build.sh
          bash -n build/ntdll-unix/build.sh
          bash -n build/ntdll-unix/compile_patched.sh
          bash -n build/win32u-unix/build.sh
          python3 -m py_compile tools/check-build-inputs.py
          echo "All Wine build scripts syntax OK"
          ls -lh build/wineserver/config_ios.h build/ntdll-unix/shims/ 2>&1 | head -n 30
          # Check that wine/build-macos would be generated by configure — dry-run only
          if [[ -f wine/build-macos/include/config.h ]]; then
            echo "wine/build-macos/config.h present (from cache)"
            head -n 20 wine/build-macos/include/config.h
          else
            echo "::notice::wine/build-macos/include/config.h not present — full 'wine/configure --host=aarch64-apple-darwin' (~15min) required before wineserver/ntdll can compile. This scaffolding job validates scripts only."
          fi
      - name: Ensure CI placeholders for Xcode validation
        run: bash tools/ensure-ci-placeholders.sh
      - name: Show what full build would produce
        run: |
          cat build/wineserver/build.sh | head -n 40
          echo "---"
          ls -lh app/Madeira/libwineserver.a app/Madeira/libntdll_unix.a 2>&1 | head -n 20
          python3 tools/check-build-inputs.py --output /tmp/wine-audit.json || true
          cat /tmp/wine-audit.json | python3 -m json.tool | head -n 60

  wine-unix-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Fetch wine + FEX
        run: git submodule update --init --recursive --depth 1 wine
      - name: Install Wine build deps
        run: |
          brew install bison flex 2>&1 | tail -n 20
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH
          /opt/homebrew/opt/bison/bin/bison --version
          bison --version || true
      - name: Configure Wine for macOS (generates config.h for iOS cross)
        run: |
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          bison --version
          cd wine
          mkdir -p build-macos
          # Minimal configure to generate include/config.h and dlls/ntdll headers for the iOS unixlibs.
          # Uses macOS SDK, not iOS — iOS flags are in build/ntdll-unix/build.sh (xcrun iphoneos).
          ./configure --enable-win64 --without-x --without-freetype --without-vulkan --disable-tests --prefix=/tmp/wine-ios > ../wine-configure.log 2>&1 || { cat ../wine-configure.log; exit 1; }
          head -n 30 build-macos/include/config.h
      - name: Build wineserver iOS lib
        run: bash build/wineserver/build.sh 2>&1 | tee wineserver.log
      - name: Build ntdll/win32u iOS libs
        run: |
          bash build/ntdll-unix/build.sh 2>&1 | tee ntdll.log
          bash build/win32u-unix/build.sh 2>&1 | tee win32u.log || echo "::warning::win32u build failed — see win32u.log"
      - name: Verify libs
        run: |
          ls -lh app/Madeira/libwineserver.a app/Madeira/libntdll_unix.a app/Madeira/libwin32u_unix.a
          lipo -info app/Madeira/lib*.a || true
      - uses: actions/upload-artifact@v5
        with:
          name: wine-unix-libs
          path: |
            app/Madeira/libwineserver.a
            app/Madeira/libntdll_unix.a
            app/Madeira/libwin32u_unix.a
            wineserver.log
            ntdll.log
          if-no-files-found: error
          retention-days: 7
