name: Build GnuTLS stack for iOS

on:
  workflow_dispatch:
  push:
    branches: [fix/ci-ios-build, main]
    paths:
      - ".github/workflows/uncrashed-gnutls.yml"
      - "build/gnutls-ios/**"
      - "build/crypto-unix/**"

permissions:
  contents: read

concurrency:
  group: uncrashed-gnutls-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gnutls-ios:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Cache GnuTLS build (GMP/Nettle/GnuTLS obj + toolchain)
        uses: actions/cache@v4
        with:
          path: |
            toolchains/gnutls-ios
            build/gnutls-ios/obj
          key: gnutls-ios-${{ runner.arch }}-xcode26.3-${{ hashFiles('build/gnutls-ios/src/SHA256SUMS', 'build/gnutls-ios/build.sh') }}
          restore-keys: |
            gnutls-ios-
      - name: Prepare build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          clang --version
          # Ensure tarballs are present (tracked)
          ls -lh build/gnutls-ios/src/
          cat build/gnutls-ios/src/SHA256SUMS
          (cd build/gnutls-ios/src && shasum -a 256 -c SHA256SUMS)
      - name: Build GMP/Nettle/GnuTLS for iOS
        run: |
          set -x
          bash build/gnutls-ios/build.sh 2>&1 | tee gnutls-build.log
          echo "=== libs ==="
          ls -lh toolchains/gnutls-ios/lib/*.a
          for lib in gmp nettle hogweed gnutls; do
            python3 tools/validate-ios-bundle.py --archive "toolchains/gnutls-ios/lib/lib$lib.a"
          done
          file toolchains/gnutls-ios/lib/*.a | head -n 20
      - name: Save GnuTLS static libs
        uses: actions/upload-artifact@v5
        with:
          name: gnutls-ios-arm64
          path: |
            toolchains/gnutls-ios/lib/*.a
            toolchains/gnutls-ios/include/**
            gnutls-build.log
            build/gnutls-ios/obj/*-configure.log
            build/gnutls-ios/obj/*-make.log
          if-no-files-found: error
          retention-days: 7
      - name: Save diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: gnutls-diagnostics
          path: |
            gnutls-build.log
            build/gnutls-ios/obj/*.log
            toolchains/gnutls-ios/lib/*.a
          if-no-files-found: warn
          retention-days: 7
