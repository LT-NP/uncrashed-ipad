name: Uncrashed source and build-input checks

on:
  workflow_dispatch:
  push:
    branches: [fix/ci-ios-build, main]
    paths:
      - ".github/workflows/uncrashed-preflight.yml"
      - "app/**"
      - "tools/**"
      - "scripts/**"
      - "build/crypto-unix/**"
      - "wine"

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check out Wine sources for symbol generator tests
        run: git submodule update --init --depth 1 wine
      - name: Test GnuTLS archive parsing and symbol generation
        timeout-minutes: 2
        run: python3 -m unittest discover -s tools -p 'test_*sym*.py'
      - name: Validate Xcode project and property lists
        run: |
          plutil -lint app/Madeira.xcodeproj/project.pbxproj
          plutil -lint app/Madeira/Info.plist app/Madeira/Madeira.entitlements
          xcodebuild -project app/Madeira.xcodeproj -list
      - name: Validate Xcode build settings without linking
        run: |
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira -sdk iphoneos -showBuildSettings | head -n 100
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO -showBuildSettings | grep -E "PRODUCT_BUNDLE_IDENTIFIER|CODE_SIGN_ENTITLEMENTS|SDKROOT" | head -n 20
      - name: Parse Swift source (not type checking or linking)
        run: xcrun swiftc -frontend -parse app/Madeira/*.swift
      - name: Check Python and transfer script syntax
        run: |
          python3 -m py_compile tools/*.py
          bash -n scripts/deploy-uncrashed.sh
          bash -n scripts/deploy-thumper.sh
          bash -n scripts/build-fex-ios.sh
          bash -n scripts/prepare-wine-ios.sh
          bash -n tools/check-prefix-template.sh
          bash -n tools/ensure-ci-placeholders.sh
          bash -n tools/fetch-vcruntime.sh
      - name: Inventory missing native build inputs
        # This check is expected to report "missing" before the native
        # libraries are built on the macOS runner. It produces an audit
        # JSON for the next step and should NOT fail the job when inputs
        # are still incomplete – the previous behaviour caused every run
        # to be red before any native build had ever succeeded.
        run: |
          set +e
          python3 tools/check-build-inputs.py --output build-input-audit.json
          status=$?
          cat build-input-audit.json
          if [ $status -ne 0 ]; then
            echo "::warning::Native build inputs incomplete – audit saved to build-input-audit.json. This is expected before 'Build Uncrashed runtime dependencies' has succeeded."
          fi
          # Always exit 0 so the workflow is green and the audit artifact is available.
          # A separate job can gate on ready_for_compile_attempt if strict gating is needed.
          exit 0
      - name: Save input inventory even when prerequisites are missing
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: build-input-audit
          path: build-input-audit.json
          if-no-files-found: warn
          retention-days: 7
