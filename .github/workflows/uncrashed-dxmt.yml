name: Build DXMT iOS

on:
  workflow_dispatch:
  push:
    branches: [fix/ci-ios-build, main]
    paths:
      - ".github/workflows/uncrashed-dxmt.yml"
      - "build/dxmt-ios/**"
      - "build/freetype-ios/**"
      - "scripts/prepare-wine-ios.sh"
      - "tools/validate-ios-bundle.py"
      - "research/dxmt/**"
      - "wine/**"

permissions:
  contents: read

concurrency:
  group: uncrashed-dxmt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Fetch Wine sources for symbol generator tests
        run: git submodule update --init --depth 1 wine
      - name: Check build scripts and validators
        shell: bash
        run: |
          for script in build/dxmt-ios/*.sh build/freetype-ios/build.sh scripts/prepare-wine-ios.sh; do
            bash -n "$script"
          done
          python3 -m unittest discover -s tools -p 'test_*.py'

  dxmt-build:
    if: github.event_name == 'workflow_dispatch'
    needs: source-check
    runs-on: macos-15
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      JOBS: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Verify Xcode and install build tools
        run: |
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install llvm bison flex cmake ninja meson
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Fetch pinned DXMT and Wine sources
        run: git submodule update --init --recursive --depth 1 research/dxmt wine
      - name: Restore LLVM source and host/iOS builds
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
          key: ipa-llvm15-${{ runner.arch }}-xcode26.3-${{ hashFiles('build/dxmt-ios/build-llvm.sh') }}
      - name: Build and validate LLVM for iOS
        run: bash build/dxmt-ios/build-llvm.sh 2>&1 | tee llvm-build.log
      - name: Save completed LLVM build
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Build Wine inputs, DXMT PE modules and native library
        run: bash build/dxmt-ios/build-all.sh 2>&1 | tee dxmt-build.log
      - name: Upload validated DXMT outputs
        uses: actions/upload-artifact@v5
        with:
          name: dxmt-ios
          path: |
            app/Madeira/libdxmt_combined.a
            app/Madeira/aarch64-windows/d3d11.dll
            app/Madeira/aarch64-windows/dxgi.dll
            app/Madeira/aarch64-windows/winemetal.dll
            app/Madeira/aarch64-windows/d3d10core.dll
          if-no-files-found: error
          retention-days: 7
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dxmt-build-logs
          path: |
            *-build.log
            wine-configure.log
            wine/build-macos/config.log
            build/dxmt-ios/obj/*.log
            build/dxmt-ios/pe/meson-logs/**
            toolchains/llvm-*/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: warn
          retention-days: 7
