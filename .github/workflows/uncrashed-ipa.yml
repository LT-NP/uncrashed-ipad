name: Build IPA (hosted, unsigned)

on:
  workflow_dispatch:
  push:
    branches: [fix/ci-ios-build]
    paths:
      - ".github/workflows/uncrashed-ipa.yml"
      - "app/**"
      - "build/**"
      - "scripts/**"
      - "tools/**"

permissions:
  contents: read

concurrency:
  group: uncrashed-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Test bundle validation
        run: python3 tools/test_validate_ios_bundle.py
      - name: Verify Xcode and install native tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install llvm bison flex
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Fetch all submodules (FEX, wine, dxmt)
        run: git submodule update --init --recursive --depth 1
      - name: Restore FEX + GnuTLS + Wine + DXMT caches
        uses: actions/cache@v4
        with:
          path: |
            FEX/build-ios
            toolchains/gnutls-ios
            build/gnutls-ios/obj
            wine/build-macos
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
            toolchains/llvm-ios-build
          key: ipa-cache-${{ hashFiles('scripts/build-fex-ios.sh', 'build/gnutls-ios/build.sh', 'wine/configure.ac') }}-xcode26.3-v2
      - name: Ensure Wine PE toolchain (llvm-mingw)
        run: |
          if [[ -d toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin ]]; then echo "llvm-mingw cached"; exit 0; fi
          mkdir -p toolchains
          curl --fail --location https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/llvm-mingw-20260421-ucrt-macos-universal.tar.xz | tar -xJ -C toolchains/
      - name: Build FEX if not cached
        run: |
          if [[ -f FEX/build-ios/FEXCore/Source/libFEXCore.a ]]; then echo "FEX cached"; lipo -info FEX/build-ios/FEXCore/Source/libFEXCore.a | head; exit 0; fi
          bash scripts/build-fex-ios.sh
      - name: Build GnuTLS stack if not cached
        run: |
          if [[ -f toolchains/gnutls-ios/lib/libgnutls.a ]]; then echo "GnuTLS cached"; exit 0; fi
          bash build/gnutls-ios/build.sh 2>&1 | tee gnutls-build.log
      - name: Configure Wine if not cached
        run: |
          if [[ -f wine/build-macos/include/config.h ]]; then echo "wine config cached"; exit 0; fi
          brew list bison >/dev/null 2>&1 || brew install bison flex
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          export PATH="$PWD/toolchains/llvm-mingw-20260421-ucrt-macos-universal/bin:$PATH"
          mkdir -p wine/build-macos
          cd wine/build-macos
          ../configure --enable-win64 --without-x --without-freetype --without-vulkan --disable-tests --prefix=/tmp/wine-ios > ../../wine-configure.log 2>&1 || { cat ../../wine-configure.log; exit 1; }
      - name: Generate Wine headers and build FreeType
        run: |
          make -C wine/build-macos -j3 include/all 2>&1 | tee wine-headers-build.log
          git init research/freetype
          git -C research/freetype fetch --depth 1 https://github.com/freetype/freetype.git 42608f77f20749dd6ddc9e0536788eaad70ea4b5
          git -C research/freetype checkout --detach FETCH_HEAD
          bash build/freetype-ios/build.sh 2>&1 | tee freetype-build.log
      - name: Build Wine unix libs
        run: |
          bash build/wineserver/build.sh 2>&1 | tee wineserver-build.log
          bash build/ntdll-unix/build.sh 2>&1 | tee ntdll-build.log
          bash build/win32u-unix/build.sh 2>&1 | tee win32u-build.log
          ls -lh app/Madeira/libwineserver.a app/Madeira/libntdll_unix.a app/Madeira/libwin32u_unix.a
      - name: Build DXMT native library
        run: |
          # LLVM must be built for iOS; empty archives cannot satisfy this input.
          python3 tools/validate-ios-bundle.py --archive toolchains/llvm-ios-build/lib/libLLVMCore.a
          bash build/dxmt-ios/build.sh 2>&1 | tee dxmt-build.log
          xcrun -sdk iphoneos libtool -static -o build/dxmt-ios/libdxmt_combined.a build/dxmt-ios/obj/*.o toolchains/llvm-ios-build/lib/*.a
          cp build/dxmt-ios/libdxmt_combined.a app/Madeira/
      - name: Fetch Microsoft runtime inputs
        run: bash tools/fetch-vcruntime.sh 2>&1 | tee vcruntime-build.log
        env:
          VCRUNTIME_URL: ${{ secrets.VCRUNTIME_URL }}
      - name: Check required native archives
        run: |
          for lib in libwineserver.a libntdll_unix.a libwin32u_unix.a libdxmt_combined.a; do
            python3 tools/validate-ios-bundle.py --archive "app/Madeira/$lib"
          done
      - name: Xcode build (unsigned, no signing)
        run: |
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira -sdk iphoneos -configuration Release -derivedDataPath "$RUNNER_TEMP/madeira-derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee xcode-build.log
      - name: Validate and package unsigned app
        run: |
          APP="$RUNNER_TEMP/madeira-derived/Build/Products/Release-iphoneos/Madeira.app"
          python3 tools/validate-ios-bundle.py --app "$APP"
          mkdir -p "$RUNNER_TEMP/madeira-package/Payload"
          cp -R "$APP" "$RUNNER_TEMP/madeira-package/Payload/"
          (cd "$RUNNER_TEMP/madeira-package" && zip -qr "$GITHUB_WORKSPACE/Madeira-unsigned.ipa" Payload)
          python3 tools/validate-ios-bundle.py --ipa Madeira-unsigned.ipa
          echo "Unsigned bundle validated. Signing and device JIT still require testing."
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: Madeira-unsigned-ipa
          path: Madeira-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ipa-build-logs
          path: |
            *-build.log
            ${{ runner.temp }}/madeira-derived/Logs/Build/**
            build/**/obj/*.err
            build/**/obj/err-*.txt
            wine-configure.log
            build/gnutls-ios/obj/*.log
          if-no-files-found: warn
          retention-days: 7
