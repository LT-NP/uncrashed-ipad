name: Build IPA (hosted, unsigned)

on:
  workflow_dispatch:
  push:
    branches: [fix/ci-ios-build]
    paths:
      - ".github/workflows/uncrashed-ipa.yml"
      - "app/**"
      - "build/**"
      - "scripts/**"
      - "tools/**"
      - "patches/**"
      - "FEX/**"
      - "wine/**"
      - "research/dxmt/**"

permissions:
  contents: read

concurrency:
  group: uncrashed-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Test runtime and bundle validation
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Verify Xcode and install native tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          brew install llvm bison flex cmake ninja meson sevenzip
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
      - name: Fetch all submodules (FEX, Wine, DXMT)
        run: git submodule update --init --recursive --depth 1
      - name: Record dependency revisions
        id: revisions
        run: |
          echo "fex=$(git -C FEX rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "wine=$(git -C wine rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "dxmt=$(git -C research/dxmt rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Restore FEX, GnuTLS and Wine dependencies
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            FEX/build-ios
            toolchains/gnutls-ios
            build/gnutls-ios/obj
            wine/build-macos
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
          key: ipa-native-${{ runner.arch }}-xcode26.3-${{ steps.revisions.outputs.fex }}-${{ steps.revisions.outputs.wine }}-${{ steps.revisions.outputs.dxmt }}-${{ hashFiles('scripts/build-fex-ios.sh', 'scripts/prepare-wine-ios.sh', 'patches/fex-ios-arm64-mbi.patch', 'build/gnutls-ios/build.sh', 'build/gnutls-ios/src/SHA256SUMS') }}
      - name: Build and validate FEX
        run: |
          libraries=(
            FEXCore/Source/libFEXCore.a FEXCore/Source/libFEXCore_Base.a
            FEXCore/Source/libJemallocLibs.a External/fmt/libfmt.a
            External/cephes/libcephes_128bit.a
            External/xxhash/cmake_unofficial/libxxhash.a
            External/SoftFloat-3e/libsoftfloat_3e.a
          )
          valid=true
          for library in "${libraries[@]}"; do
            python3 tools/validate-ios-bundle.py --archive "FEX/build-ios/$library" || valid=false
          done
          if [[ "$valid" != true ]]; then
            bash scripts/build-fex-ios.sh 2>&1 | tee fex-build.log
          fi
          for library in "${libraries[@]}"; do
            python3 tools/validate-ios-bundle.py --archive "FEX/build-ios/$library"
          done
      - name: Build and stage GnuTLS stack
        run: |
          valid=true
          for library in gmp nettle hogweed gnutls; do
            python3 tools/validate-ios-bundle.py --archive "toolchains/gnutls-ios/lib/lib$library.a" || valid=false
          done
          [[ -f toolchains/gnutls-ios/include/gnutls/gnutls.h ]] || valid=false
          if [[ "$valid" != true ]]; then
            rm -f build/gnutls-ios/obj/{gmp,nettle,gnutls}.done
            bash build/gnutls-ios/build.sh 2>&1 | tee gnutls-build.log
          fi
          for library in gmp nettle hogweed gnutls; do
            python3 tools/validate-ios-bundle.py --archive "toolchains/gnutls-ios/lib/lib$library.a"
            cp "toolchains/gnutls-ios/lib/lib$library.a" app/Madeira/
          done
      - name: Prepare Wine toolchain, headers and FreeType
        run: bash scripts/prepare-wine-ios.sh 2>&1 | tee wine-prepare-build.log
      - name: Save completed native dependencies
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            FEX/build-ios
            toolchains/gnutls-ios
            build/gnutls-ios/obj
            wine/build-macos
            toolchains/llvm-mingw-20260421-ucrt-macos-universal
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Build Wine unix libraries
        run: |
          bash build/wineserver/build.sh 2>&1 | tee wineserver-build.log
          bash build/ntdll-unix/build.sh 2>&1 | tee ntdll-build.log
          bash build/win32u-unix/build.sh 2>&1 | tee win32u-build.log
      - name: Fetch and validate Microsoft runtime inputs
        run: bash tools/fetch-vcruntime.sh 2>&1 | tee vcruntime-build.log
        env:
          VCRUNTIME_URL: ${{ secrets.VCRUNTIME_URL }}
      - name: Restore LLVM source and host/iOS builds
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
          key: ipa-llvm15-${{ runner.arch }}-xcode26.3-${{ hashFiles('build/dxmt-ios/build-llvm.sh') }}
      - name: Build LLVM for iOS
        run: bash build/dxmt-ios/build-llvm.sh 2>&1 | tee llvm-build.log
      - name: Save LLVM before compiling DXMT
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            toolchains/llvm-project
            toolchains/llvm-host-build
            toolchains/llvm-ios-build
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Build DXMT native library and ARM64 PE modules
        run: bash build/dxmt-ios/build-all.sh 2>&1 | tee dxmt-build.log
      - name: Validate inputs before Xcode
        run: |
          for library in wineserver ntdll_unix win32u_unix dxmt_combined gmp nettle hogweed gnutls; do
            python3 tools/validate-ios-bundle.py --archive "app/Madeira/lib$library.a"
          done
          python3 tools/validate-ios-bundle.py --resources app/Madeira
          bash tools/check-prefix-template.sh
          python3 tools/check-build-inputs.py --output build-input-audit.json
      - name: Xcode build (unsigned)
        run: |
          xcodebuild -project app/Madeira.xcodeproj -scheme Madeira -sdk iphoneos -configuration Release -derivedDataPath "$RUNNER_TEMP/madeira-derived" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee xcode-build.log
      - name: Validate and package unsigned app
        run: |
          APP="$RUNNER_TEMP/madeira-derived/Build/Products/Release-iphoneos/Madeira.app"
          python3 tools/validate-ios-bundle.py --app "$APP"
          mkdir -p "$RUNNER_TEMP/madeira-package/Payload"
          cp -R "$APP" "$RUNNER_TEMP/madeira-package/Payload/"
          (cd "$RUNNER_TEMP/madeira-package" && zip -qr "$GITHUB_WORKSPACE/Madeira-unsigned.ipa" Payload)
          python3 tools/validate-ios-bundle.py --ipa Madeira-unsigned.ipa
          echo "Unsigned bundle validated. Signing and device execution remain untested."
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v5
        with:
          name: Madeira-unsigned-ipa
          path: Madeira-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Save build diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ipa-build-logs
          path: |
            *-build.log
            build-input-audit.json
            ${{ runner.temp }}/madeira-derived/Logs/Build/**
            build/**/obj/*.err
            build/**/obj/err-*.txt
            wine-configure.log
            wine-headers-build.log
            wine-dxmt-pe-build.log
            freetype-build.log
            build/gnutls-ios/obj/*.log
            toolchains/llvm-*/CMakeFiles/CMakeConfigureLog.yaml
            build/dxmt-ios/pe/meson-logs/**
          if-no-files-found: warn
          retention-days: 7
