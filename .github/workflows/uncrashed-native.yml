name: Build Uncrashed runtime dependencies

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uncrashed-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fex-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch pinned FEX sources
        run: git submodule update --init --recursive --depth 1 FEX
      - name: Prepare build tools
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build FEX for iPad
        run: bash scripts/build-fex-ios.sh
      - name: Save libraries and generated headers
        uses: actions/upload-artifact@v4
        with:
          name: fex-ios-arm64
          path: |
            FEX/build-ios/**/*.a
            FEX/build-ios/**/*.h
            FEX/build-ios/**/*.inc
            FEX/build-ios/CMakeCache.txt
          if-no-files-found: error
          retention-days: 7
      - name: Save configuration diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fex-configuration-diagnostics
          path: |
            FEX/build-ios/CMakeCache.txt
            FEX/build-ios/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
